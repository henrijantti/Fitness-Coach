<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kunto share image</title>
<!-- The 1200×630 share image (site/og.png). tools/shoot_pages.py renders it next to a built site, so the
     relative paths below resolve against _site/. -->
<link rel="stylesheet" href="fonts/manrope.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #f3f4f9; color: #191b2b; font-family: Manrope, system-ui, sans-serif; display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 0 0 72px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
.brand img { width: 44px; height: 44px; }
h1 { font-size: 76px; line-height: 1.0; letter-spacing: -.04em; margin: 34px 0 24px; font-weight: 800; }
h1 em { font-style: normal; color: #5a5ad6; }
p { margin: 0; font-size: 26px; line-height: 1.35; color: #2f3247; max-width: 20em; }
.chip { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; font-size: 20px; font-weight: 800; padding: 8px 16px; border-radius: 999px; background: #e3f5ec; color: #12704e; }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.stage { height: 630px; position: relative; overflow: hidden; }
.phone { position: absolute; left: 40px; top: 70px; width: 360px; border-radius: 44px; overflow: hidden; border: 10px solid #191b2b; background: #fff; box-shadow: 0 40px 80px -24px rgba(25,27,43,.4); }
.phone img { display: block; width: 100%; }
</style>
</head>
<body>
<div>
  <div class="brand"><img src="favicon.svg" alt="">Kunto</div>
  <h1>Your training,<br><em>read in ten seconds.</em></h1>
  <p>Garmin and Hevy data in one page, with a read-only AI coach.</p>
  <span class="chip">Live demo on synthetic data</span>
</div>
<div class="stage"><div class="phone"><img src="img/phone-overview-light.webp" alt=""></div></div>
</body>
</html>
